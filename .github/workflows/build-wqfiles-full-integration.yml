name: Build VINI Phase 1 for physical iPhone

on:
  push:
    branches: [experiment/3105-visual-redesign]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-experimental:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select installed Xcode
        shell: bash
        run: |
          set -euo pipefail
          XCODE_APP="$(find /Applications -maxdepth 1 -type d -name 'Xcode*.app' -print | sort | tail -n 1)"
          test -n "$XCODE_APP"
          sudo xcode-select --switch "$XCODE_APP/Contents/Developer"
          xcodebuild -version | tee xcode-version.txt

      - name: Verify integration provenance and target
        run: |
          git diff --check
          python3 scripts/verify-vini-phase1.py

      - name: Build unsigned experimental device app
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build-experimental
          mkdir -p build-experimental/Products/Release
          xcodebuild \
            -project ThreeOneOSFive.xcodeproj \
            -scheme 3105 \
            -sdk iphoneos \
            -configuration ExperimentalRelease \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build-experimental/DerivedData \
            CONFIGURATION_BUILD_DIR="$PWD/build-experimental/Products/Release" \
            DEAD_CODE_STRIPPING=NO \
            STRIP_INSTALLED_PRODUCT=NO \
            COPY_PHASE_STRIP=NO \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee build-experimental/xcodebuild.log

      - name: Package experimental unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find build-experimental/Products/Release -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          test -x "$APP_PATH/3105"
          test -f "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist" | grep -Fx 'com.apple.mobile.MobileHouseArrest'
          mkdir -p build-experimental/Payload
          cp -R "$APP_PATH" build-experimental/Payload/
          (cd build-experimental && /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload VINI-Phase1-Unsigned.ipa)
          {
            echo '# VINI Phase 1 physical iPhone build report'
            echo
            echo "- Commit: $(git rev-parse HEAD)"
            echo "- Variant: ExperimentalRelease"
            echo "- Requested App Group: group.pigtjing.top"
            echo "- Entitlements file: ThreeOneOSFive/3105-Experimental.entitlements"
            echo '- Signing: disabled; IPA is unsigned'
            echo '- Effective signed entitlements: not verifiable until authorized signing'
            echo '- Device test: not performed by GitHub Actions'
          } > build-experimental/BUILD-REPORT.md

      - name: Check linked WQFiles runtime
        run: |
          APP_PATH="$(find build-experimental/Products/Release -maxdepth 1 -type d -name '*.app' -print -quit)"
          nm "$APP_PATH/3105" > build-experimental/symbols.txt
          for symbol in wq_grant wq_enumerate wq_reset_access_cache wq_health_run wq_purge_contents_cancellable wq_write WQIntegratedMakeViewController; do
            grep -q "_$symbol$" build-experimental/symbols.txt || { echo "Missing linked symbol: $symbol"; exit 1; }
          done
          test -f "$APP_PATH/WQFilesResources.bundle/es.lproj/Localizable.strings"

      - name: Upload experimental artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VINI-Phase1-Unsigned
          path: |
            build-experimental/VINI-Phase1-Unsigned.ipa
            build-experimental/BUILD-REPORT.md
            build-experimental/xcodebuild.log
            xcode-version.txt
          retention-days: 30

  static-validation:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select installed Xcode
        run: |
          XCODE_APP="$(find /Applications -maxdepth 1 -type d -name 'Xcode*.app' -print | sort | tail -n 1)"
          sudo xcode-select --switch "$XCODE_APP/Contents/Developer"
      - name: Verify presentation isolation and preserved functional code
        run: |
          set -euo pipefail
          mkdir -p build-static
          python3 scripts/verify-vini-phase1.py | tee build-static/preservation.log
          python3 Vendor/WQFiles/tests/test_localization.py 2>&1 | tee build-static/localization.log
          python3 Vendor/WQFiles/tests/browser_ui_regressions.py | tee build-static/legacy-ui-static.log
          plutil -lint ThreeOneOSFive/Info.plist ThreeOneOSFive/3105-Experimental.entitlements ThreeOneOSFive/WQFilesResources.bundle/Info.plist | tee build-static/plist.log
      - name: Strict syntax and dependency link checks for physical arm64
        shell: bash
        run: |
          set -euo pipefail
          cd Vendor/WQFiles
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          SOURCES=(WQCore.m WQAccess.m WQLocalization.m WQLaunchServices.m WQUI.m WQSharing.m WQApps.m WQCache.m WQPlistEditor.m WQHexViewer.m WQSQLiteViewer.m WQSQLiteSave.m WQHealth.m WQTrash.m WQArchive.m WQSyntax.m WQMediaStream.m main.m)
          FLAGS=(-fobjc-arc -fmodules -arch arm64 -miphoneos-version-min=26.0 -isysroot "$SDK" -Wall -Wextra -Werror -O2)
          xcrun --sdk iphoneos clang -fsyntax-only "${FLAGS[@]}" "${SOURCES[@]}" > ../../build-static/arm64-syntax.log 2>&1
          xcrun --sdk iphoneos clang "${FLAGS[@]}" "${SOURCES[@]}" -framework UIKit -framework Foundation -framework Security -framework UniformTypeIdentifiers -framework AVFoundation -framework AVKit -lsqlite3 -lz -o ../../build-static/WQFiles-arm64-link-check > ../../build-static/arm64-link.log 2>&1
          echo 'PASS: physical arm64 strict syntax and dependency link checks; binaries were not executed.' | tee ../../build-static/arm64-result.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: VINI-Phase1-Static-Checks
          path: build-static/
