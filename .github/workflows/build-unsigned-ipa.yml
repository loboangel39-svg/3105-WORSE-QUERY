name: Build VINI 2.0 RC11 unsigned IPA

on: [push, workflow_dispatch]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select compatible Xcode
        shell: bash
        run: |
          set -euo pipefail
          XCODE_APP="$(find /Applications -maxdepth 1 -type d -name 'Xcode*.app' -print | sort | tail -n 1)"
          test -n "$XCODE_APP"
          sudo xcode-select --switch "$XCODE_APP/Contents/Developer"
          xcodebuild -version | tee xcode-version.txt

      - name: Discover scheme and validate integration
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -list -json -project ThreeOneOSFive.xcodeproj > schemes.json
          SCHEME="$(python3 -c 'import json; s=json.load(open("schemes.json"))["project"]["schemes"]; print("3105" if "3105" in s else s[0])')"
          echo "SCHEME=$SCHEME" >> "$GITHUB_ENV"
          git diff --check
          grep -q 'PRODUCT_BUNDLE_IDENTIFIER = "com.apple.mobile.MobileHouseArrest";' ThreeOneOSFive.xcodeproj/project.pbxproj
          grep -q 'RemotePatchService.swift in Sources' ThreeOneOSFive.xcodeproj/project.pbxproj
          grep -q 'PatchDownloadService.swift in Sources' ThreeOneOSFive.xcodeproj/project.pbxproj
          grep -q 'PatchSyncManager.swift in Sources' ThreeOneOSFive.xcodeproj/project.pbxproj
          grep -q 'VINIDualBackupStore.swift in Sources' ThreeOneOSFive.xcodeproj/project.pbxproj
          grep -q 'ContainerAccessCoordinator.swift in Sources' ThreeOneOSFive.xcodeproj/project.pbxproj
          grep -q 'worse_query_adapter.m in Sources' ThreeOneOSFive.xcodeproj/project.pbxproj

      - name: Build iPhone arm64 unsigned app
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build
          mkdir -p build/Products/Release
          xcodebuild \
            -project ThreeOneOSFive.xcodeproj \
            -scheme "$SCHEME" \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CONFIGURATION_BUILD_DIR="$PWD/build/Products/Release" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tee build/xcodebuild.log

      - name: Package and verify RC11 IPA
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find build/Products/Release -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          test -x "$APP_PATH/3105"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist" | grep -Fx 'com.apple.mobile.MobileHouseArrest'
          test "$(find build/DerivedData -type f \( -name 'worse_query.o' -o -name 'worse_query_adapter.o' -o -name 'ContainerAccessCoordinator.o' \) | wc -l | tr -d ' ')" -ge 3
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
           (cd build && ditto -c -k --sequesterRsrc --keepParent Payload VINI-2.0-RC11-Unsigned.ipa)
           test -f build/VINI-2.0-RC11-Unsigned.ipa
           shasum -a 256 build/VINI-2.0-RC11-Unsigned.ipa | tee build/VINI-2.0-RC11-Unsigned.ipa.sha256
          {
             echo '# VINI 2.0 RC11 build report'
            echo "- Commit: $GITHUB_SHA"
            echo '- Runner: macos-latest'
            echo '- SDK: iphoneos'
            echo '- Architecture: arm64'
            echo '- Signing: disabled'
            echo '- Bundle ID: com.apple.mobile.MobileHouseArrest'
             echo '- IPA: VINI-2.0-RC11-Unsigned.ipa'
             echo "- SHA-256: $(cut -d ' ' -f 1 build/VINI-2.0-RC11-Unsigned.ipa.sha256)"
            echo '- Physical-device tests: pending'
          } > build/BUILD-REPORT.md

      - name: Upload RC11 artifact
        uses: actions/upload-artifact@v4
        with:
           name: VINI-2.0-RC11-Unsigned
          path: |
             build/VINI-2.0-RC11-Unsigned.ipa
             build/VINI-2.0-RC11-Unsigned.ipa.sha256
            build/BUILD-REPORT.md
            build/xcodebuild.log
            xcode-version.txt
